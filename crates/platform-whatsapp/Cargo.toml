[package]
name = "hermes-platform-whatsapp"
version = "0.1.0"
edition = "2021"
description = "Hermes Gateway - WhatsApp Cloud API adapter"

[dependencies]
bytes = { version = "1.5", features = ["serde"] }
hermes-platform-adapter = { path = "../platform-adapter" }
hermes-protocol = { path = "../protocol" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
time = "0.3"
dashmap = "6.1"
thiserror = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
base64 = "0.22"