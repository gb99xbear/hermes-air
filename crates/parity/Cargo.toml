[package]
name = "hermes_parity"
version = "0.1.0"
edition = "2021"
description = "Parity instrumentation for Hermes Air - compatible with Python Hermes parity module"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
parking_lot = "0.12"
once_cell = "1.18"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
lazy_static = "1.4"