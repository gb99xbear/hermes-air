[gateway]
name = "hermes-gateway"
version = "0.1.0"
max_concurrent_sessions = 100
default_profile = "default"
shutdown_timeout_secs = 30
restart_on_config_change = false

[profiles.default]
name = "Hermes"
model_provider = "default"
model = "ag/gemini-3.8-flash"
temperature = 0.7
max_tokens = 4096
system_prompt = "You are Hermes, a helpful, capable, and unfiltered personal AI assistant."
tools = ["terminal", "read_file", "write_file"]
skills = []
mcp_servers = []
platform_overrides = {}

[platforms.telegram]
enabled = false
adapter = "telegram"
config = { bot_token = "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ", timeout_secs = 30 }

[plugins]
enabled = false
directory = "plugins"
python_plugins = false
allowed_plugins = []
blocked_plugins = []

[session_store]
backend = "memory"
local_cache_size = 1000
default_ttl_secs = 86400

[logging]
level = "info"
format = "text"
output = "stdout"
max_file_size_mb = 100
max_files = 5

[metrics]
enabled = false
port = 9090
path = "/metrics"

[dashboard]
enabled = false
host = "127.0.0.1"
port = 8080

[tui]
enabled = false

[acp]
enabled = false
port = 9095
